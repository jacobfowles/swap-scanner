<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Swap Scanner">
<title>Swap Scanner — Panini World Cup 2026</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gate" class="gate" hidden>
  <form id="gate-form" class="gate-card" autocomplete="on">
    <img src="icon.svg" alt="" width="64" height="64">
    <h1>Swap Scanner</h1>
    <label for="gate-password">Password</label>
    <input id="gate-password" type="password" autocomplete="current-password" required>
    <p id="gate-error" class="error"></p>
    <button type="submit" class="primary big">Open</button>
  </form>
</div>
<script src="js/config.js"></script>
<script src="js/gate.js"></script>
<header>
  <h1>Swap Scanner</h1>
  <span id="total-badge" class="badge">0 spares</span>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="scan" class="active">Scan</button>
  <button role="tab" data-tab="catalog">Catalog</button>
</nav>

<div class="catalog-bar">
  <label for="catalog-select">Catalog</label>
  <select id="catalog-select" aria-label="Current catalog"></select>
</div>

<main>
  <section id="tab-scan" class="tab active">
    <div id="camera" class="camera">
      <video id="video" playsinline muted autoplay></video>
      <div class="guide" id="guide"><i class="code-mark">NZL 3</i><span>Fit the back of the sticker in the box</span></div>
      <div id="banner" class="banner" hidden role="status" aria-live="assertive">
        <b id="banner-main"></b><span id="banner-sub"></span>
      </div>
      <div id="area-editor" class="area-editor" hidden>
        <div id="area-draw" class="area-draw" hidden></div>
        <p class="area-help">Drag a box around the sticker code — or around the whole sticker</p>
      </div>
      <div id="camera-off" class="camera-off">
        <p>Point your phone at the <b>back</b> of a sticker. The app reads the code (like <b>MEX 12</b>) and adds it to your swaps list.</p>
        <button id="start-camera" class="primary big">Start camera</button>
        <p class="hint" id="camera-error"></p>
      </div>
    </div>

    <div id="area-controls" class="area-controls" hidden>
      <button id="area-save" class="primary">Save area</button>
      <button id="area-reset">Use default</button>
      <button id="area-cancel">Cancel</button>
    </div>

    <div class="scan-controls">
      <button id="scan-btn" class="primary big" disabled>Scan</button>
      <button id="undo-last" class="undo-big" disabled>↶ Undo</button>
      <button id="torch-btn" class="icon-btn" hidden title="Flashlight">🔦</button>
    </div>
    <div class="scan-options">
      <label><input type="checkbox" id="auto-scan"> Auto-scan</label>
      <label><input type="checkbox" id="auto-add"> Add without asking</label>
      <label><input type="checkbox" id="sound" checked> Sound</label>
      <button id="area-btn" class="link-btn">Scan area</button>
      <button id="manual-btn" class="link-btn">Type it in</button>
    </div>
    <p id="status" class="status">Camera is off.</p>

    <ul id="recent" class="recent"></ul>
  </section>

  <section id="tab-catalog" class="tab">
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button id="share-btn" class="primary">Share CSV</button>
      <button id="download-btn">Download CSV</button>
      <button id="copy-btn">Copy swap list</button>
      <button id="import-btn">Import CSV</button>
      <input type="file" id="import-file" accept=".csv,text/csv,text/plain" hidden>
    </div>
    <input type="search" id="filter" placeholder="Filter (e.g. ARG or Brazil)" autocomplete="off">
    <div id="catalog-list"></div>
    <p class="danger-zone">
      <button id="rename-btn" class="link-btn">Rename this catalog</button>
      <button id="clear-btn" class="link-btn danger">Clear this catalog</button>
      <button id="delete-btn" class="link-btn danger">Delete this catalog</button>
    </p>
  </section>
</main>

<!-- Confirm / edit a reading before it goes into the catalog -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="sheet-title">
    <h2 id="sheet-title">Add sticker</h2>
    <p id="sheet-read" class="hint"></p>
    <label>Team
      <select id="sheet-team"></select>
    </label>
    <div class="row">
      <label>Number
        <input id="sheet-number" type="number" inputmode="numeric" min="0" max="20">
      </label>
      <label>How many
        <span class="stepper">
          <button type="button" id="qty-minus">−</button>
          <input id="sheet-qty" type="number" inputmode="numeric" min="1" value="1">
          <button type="button" id="qty-plus">+</button>
        </span>
      </label>
    </div>
    <p id="sheet-existing" class="hint"></p>
    <p id="sheet-error" class="error"></p>
    <div class="row">
      <button id="sheet-cancel">Cancel</button>
      <button id="sheet-add" class="primary">Add</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden role="status">
  <span id="toast-text"></span>
  <button id="toast-undo" class="toast-undo">↶ UNDO</button>
</div>

<canvas id="work" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="js/teams.js"></script>
<script src="js/parse.js"></script>
<script src="js/catalog.js"></script>
<script src="js/preprocess.js"></script>
<script src="js/app.js"></script>
</body>
</html>
